<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three.js Galaxy</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 16px; bottom: 16px; color: #9ab; font: 13px/1.4 system-ui, sans-serif;
    pointer-events: none; text-shadow: 0 0 6px #000;
  }
</style>
</head>
<body>
<div id="hint">드래그: 회전 · 휠: 확대/축소 · C: 우주선 추격 카메라 on/off</div>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000008, 0.035);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 6, 14);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;

// --- Spiral galaxy (shader points) ---
const COUNT = 60000, ARMS = 4, RADIUS = 10;
const pos = new Float32Array(COUNT * 3);
const col = new Float32Array(COUNT * 3);
const size = new Float32Array(COUNT);
const inner = new THREE.Color('#ffb36b'), outer = new THREE.Color('#4a7dff');
for (let i = 0; i < COUNT; i++) {
  const r = Math.pow(Math.random(), 1.6) * RADIUS;
  const arm = (i % ARMS) / ARMS * Math.PI * 2;
  const angle = arm + r * 0.55;
  const spread = (0.08 + r * 0.05);
  const rnd = () => (Math.random() - 0.5) * 2 * Math.pow(Math.random(), 2);
  pos[i*3]   = Math.cos(angle) * r + rnd() * spread * 3;
  pos[i*3+1] = rnd() * spread * 1.5;
  pos[i*3+2] = Math.sin(angle) * r + rnd() * spread * 3;
  const c = inner.clone().lerp(outer, r / RADIUS);
  col.set([c.r, c.g, c.b], i * 3);
  size[i] = 0.5 + Math.random() * 1.5;
}
const gGeo = new THREE.BufferGeometry();
gGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
gGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
gGeo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
const gMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, vertexColors: true,
  uniforms: { uTime: { value: 0 }, uScale: { value: renderer.getPixelRatio() * innerHeight / 12 } },
  vertexShader: `
    uniform float uTime; uniform float uScale;
    attribute float aSize; varying vec3 vColor;
    void main() {
      vColor = color;
      vec3 p = position;
      float r = length(p.xz);
      float a = atan(p.z, p.x) + uTime * 0.25 / (0.6 + r * 0.25);   // 안쪽일수록 빠르게 공전
      p.x = cos(a) * r; p.z = sin(a) * r;
      p.y += sin(uTime * 1.5 + r * 2.0) * 0.05;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = aSize * uScale / -mv.z;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying vec3 vColor;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      float a = smoothstep(0.5, 0.0, d);
      gl_FragColor = vec4(vColor, a * a);
    }`
});
const galaxy = new THREE.Points(gGeo, gMat);
scene.add(galaxy);

// --- Core: glowing torus knot + wireframe shell ---
const core = new THREE.Group();
const knot = new THREE.Mesh(
  new THREE.TorusKnotGeometry(0.9, 0.28, 220, 32, 2, 3),
  new THREE.MeshStandardMaterial({ color: 0xffd2a0, emissive: 0xff7a1a, emissiveIntensity: 1.4, metalness: 0.6, roughness: 0.25 })
);
const shell = new THREE.Mesh(
  new THREE.IcosahedronGeometry(1.8, 2),
  new THREE.MeshBasicMaterial({ color: 0x66aaff, wireframe: true, transparent: true, opacity: 0.25 })
);
core.add(knot, shell);
core.position.y = 0.3;
scene.add(core);

const light = new THREE.PointLight(0xffa860, 60, 40);
core.add(light);
scene.add(new THREE.AmbientLight(0x223355, 0.8));

// --- Orbiting planets ---
const planets = [];
const defs = [
  { r: 3.2, s: 0.35, c: 0x55ddff, sp: 0.9, tilt: 0.3 },
  { r: 4.6, s: 0.5,  c: 0xff6688, sp: 0.6, tilt: -0.2 },
  { r: 6.2, s: 0.3,  c: 0x88ff99, sp: 0.4, tilt: 0.15 },
];
for (const d of defs) {
  const pivot = new THREE.Object3D();
  pivot.rotation.z = d.tilt;
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(d.s, 32, 32),
    new THREE.MeshStandardMaterial({ color: d.c, emissive: d.c, emissiveIntensity: 0.35, roughness: 0.5 })
  );
  m.position.x = d.r;
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(d.r - 0.012, d.r + 0.012, 128),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.12, side: THREE.DoubleSide })
  );
  ring.rotation.x = Math.PI / 2;
  pivot.add(m, ring);
  scene.add(pivot);
  planets.push({ pivot, m, sp: d.sp });
}

// --- Background stars ---
const sPos = new Float32Array(3000 * 3);
for (let i = 0; i < 3000; i++) {
  const v = new THREE.Vector3().randomDirection().multiplyScalar(60 + Math.random() * 60);
  sPos.set([v.x, v.y, v.z], i * 3);
}
const sGeo = new THREE.BufferGeometry();
sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
const stars = new THREE.Points(sGeo, new THREE.PointsMaterial({ size: 0.25, color: 0xffffff, sizeAttenuation: true, fog: false }));
scene.add(stars);

// --- Ringed gas giant + moon ---
const giantPivot = new THREE.Object3D();
scene.add(giantPivot);
const giant = new THREE.Group();
giant.position.x = 8.5;
const giantBody = new THREE.Mesh(
  new THREE.SphereGeometry(0.9, 48, 48),
  new THREE.MeshStandardMaterial({ color: 0xd9a86c, roughness: 0.8, emissive: 0x3a2410, emissiveIntensity: 0.4 })
);
const giantRing = new THREE.Mesh(
  new THREE.RingGeometry(1.3, 2.0, 96),
  new THREE.MeshBasicMaterial({ color: 0xe8cfa0, transparent: true, opacity: 0.55, side: THREE.DoubleSide })
);
giantRing.rotation.x = Math.PI / 2.4;
const moon = new THREE.Mesh(
  new THREE.SphereGeometry(0.18, 20, 20),
  new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 1 })
);
const moonPivot = new THREE.Object3D();
moon.position.x = 2.6;
moonPivot.add(moon);
giant.add(giantBody, giantRing, moonPivot);
giantPivot.add(giant);

// --- Asteroid belt ---
const ROCKS = 700;
const rocks = new THREE.InstancedMesh(
  new THREE.DodecahedronGeometry(1, 0),
  new THREE.MeshStandardMaterial({ color: 0x8a8076, roughness: 1, flatShading: true }),
  ROCKS
);
const tmp = new THREE.Object3D();
for (let i = 0; i < ROCKS; i++) {
  const a = Math.random() * Math.PI * 2, r = 11 + Math.random() * 1.8;
  tmp.position.set(Math.cos(a) * r, (Math.random() - 0.5) * 0.6, Math.sin(a) * r);
  tmp.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);
  tmp.scale.setScalar(0.03 + Math.random() * 0.09);
  tmp.updateMatrix();
  rocks.setMatrixAt(i, tmp.matrix);
}
scene.add(rocks);

// --- Spaceship (+Z is forward) ---
const ship = new THREE.Group();
const hullMat = new THREE.MeshStandardMaterial({ color: 0xdfe6ee, metalness: 0.8, roughness: 0.3 });
const body = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.7, 12), hullMat);
body.rotation.x = Math.PI / 2;
const wingGeo = new THREE.BoxGeometry(0.55, 0.015, 0.28);
const wingL = new THREE.Mesh(wingGeo, hullMat), wingR = new THREE.Mesh(wingGeo, hullMat);
wingL.position.set(-0.28, 0, -0.18); wingR.position.set(0.28, 0, -0.18);
wingL.rotation.z = 0.15; wingR.rotation.z = -0.15;
const fin = new THREE.Mesh(new THREE.BoxGeometry(0.015, 0.18, 0.22), hullMat);
fin.position.set(0, 0.1, -0.22);
const cockpit = new THREE.Mesh(
  new THREE.SphereGeometry(0.07, 16, 16),
  new THREE.MeshStandardMaterial({ color: 0x66ccff, emissive: 0x2288ff, emissiveIntensity: 1 })
);
cockpit.position.set(0, 0.07, 0.08);
cockpit.scale.set(1, 0.8, 1.6);
const flame = new THREE.Mesh(
  new THREE.ConeGeometry(0.07, 0.5, 12),
  new THREE.MeshBasicMaterial({ color: 0x66ddff, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false })
);
flame.rotation.x = -Math.PI / 2;   // 꼬리 쪽(-Z)으로 뻗음
flame.position.z = -0.6;
const engineLight = new THREE.PointLight(0x66ddff, 3, 4);
engineLight.position.z = -0.45;
ship.add(body, wingL, wingR, fin, cockpit, flame, engineLight);
ship.scale.setScalar(1.6);
scene.add(ship);

// 우주선 비행 경로 (은하 중심·행성 궤도 사이를 누비는 폐곡선)
const path = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-13, 2, 7), new THREE.Vector3(-4, -1.5, 11), new THREE.Vector3(6, 3, 8),
  new THREE.Vector3(12, 0.5, -2), new THREE.Vector3(5, -2.5, -9), new THREE.Vector3(-3, 2.5, -4),
  new THREE.Vector3(-1, 0.5, 3), new THREE.Vector3(-8, 3, -9), new THREE.Vector3(-13, 0, -2),
], true, 'catmullrom', 0.5);
scene.add(new THREE.Line(
  new THREE.BufferGeometry().setFromPoints(path.getPoints(300)),
  new THREE.LineBasicMaterial({ color: 0x66ddff, transparent: true, opacity: 0.12 })
));

// 엔진 트레일
const TRAIL = 140;
const trailPos = new Float32Array(TRAIL * 3);
const trailCol = new Float32Array(TRAIL * 3);
const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
trailGeo.setAttribute('color', new THREE.BufferAttribute(trailCol, 3));
const trail = new THREE.Points(trailGeo, new THREE.PointsMaterial({
  size: 0.12, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false
}));
trail.frustumCulled = false;
scene.add(trail);
const history = [];
const tail = new THREE.Vector3();

// 추격 카메라 토글
let chase = false;
addEventListener('keydown', e => {
  if (e.key.toLowerCase() !== 'c') return;
  chase = !chase;
  controls.enabled = !chase;
  controls.autoRotate = !chase;
});
const camGoal = new THREE.Vector3(), lookGoal = new THREE.Vector3(), camLook = new THREE.Vector3();

// --- Loop ---
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  gMat.uniforms.uTime.value = t;
  knot.rotation.x = t * 0.5;
  knot.rotation.y = t * 0.8;
  shell.rotation.y = -t * 0.3;
  const pulse = 1 + Math.sin(t * 2) * 0.05;
  core.scale.setScalar(pulse);
  light.intensity = 55 + Math.sin(t * 2) * 10;
  for (const p of planets) {
    p.pivot.rotation.y = t * p.sp;
    p.m.rotation.y = t * 2;
  }
  stars.rotation.y = t * 0.01;
  giantPivot.rotation.y = t * 0.12;
  giantBody.rotation.y = t * 0.5;
  moonPivot.rotation.y = t * 1.6;
  rocks.rotation.y = t * 0.05;

  // 우주선: 경로를 따라 이동하며 진행 방향을 바라보고, 커브에서 살짝 기울어짐
  const u = (t * 0.022) % 1;
  const p = path.getPointAt(u);
  const ahead = path.getPointAt((u + 0.004) % 1);
  const prevDir = ship.getWorldDirection(new THREE.Vector3());
  ship.position.copy(p);
  ship.lookAt(ahead);
  const newDir = ship.getWorldDirection(new THREE.Vector3());
  const turn = prevDir.cross(newDir).y;
  ship.rotateZ(THREE.MathUtils.clamp(-turn * 40, -0.6, 0.6));
  const f = 1 + Math.sin(t * 40) * 0.15;
  flame.scale.set(f, 1 + Math.random() * 0.3, f);
  engineLight.intensity = 2.5 + Math.random();

  tail.set(0, 0, -0.8).applyMatrix4(ship.matrixWorld);
  history.unshift(tail.clone());
  if (history.length > TRAIL) history.pop();
  for (let i = 0; i < TRAIL; i++) {
    const h = history[Math.min(i, history.length - 1)] || tail;
    const k = 1 - i / TRAIL;
    trailPos.set([h.x, h.y, h.z], i * 3);
    trailCol.set([0.3 * k, 0.8 * k, 1.0 * k], i * 3);
  }
  trailGeo.attributes.position.needsUpdate = true;
  trailGeo.attributes.color.needsUpdate = true;

  if (chase) {
    camGoal.set(0, 0.8, -3.2).applyMatrix4(ship.matrixWorld);
    lookGoal.set(0, 0, 6).applyMatrix4(ship.matrixWorld);
    camera.position.lerp(camGoal, 0.08);
    camLook.lerp(lookGoal, 0.1);
    camera.lookAt(camLook);
  } else {
    controls.update();
  }
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  gMat.uniforms.uScale.value = renderer.getPixelRatio() * innerHeight / 12;
});
</script>
</body>
</html>
