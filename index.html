<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Journey</title>
<style>
  html, body { margin: 0; height: 100%; background: radial-gradient(ellipse at center, #0b1030 0%, #000 70%); color: #e8eefc; font-family: system-ui, sans-serif; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center; padding: 0 16px; }
  h1 { margin: 0; font-size: clamp(32px, 7vw, 64px); letter-spacing: 0.04em; }
  p { margin: 0; color: #9ab; }
  a.btn {
    display: inline-block; padding: 14px 36px; border-radius: 999px; text-decoration: none;
    color: #fff; font-size: 18px; font-weight: 600;
    background: linear-gradient(135deg, #ff9a4a, #4a7dff);
    box-shadow: 0 0 24px rgba(90, 140, 255, 0.5); transition: transform .2s, box-shadow .2s;
  }
  .btns { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  a.btn.jeju { background: linear-gradient(135deg, #ff9a4a, #2fb5a0); }
  a.btn:hover { transform: scale(1.06); box-shadow: 0 0 36px rgba(255, 150, 80, 0.7); }
</style>
</head>
<body>
<main>
  <h1>🚀 Space Journey</h1>
  <p>Three.js로 만든 은하와 우주선 애니메이션</p>
  <div class="btns">
    <a class="btn" href="space.html">우주 실행하기</a>
    <a class="btn jeju" href="jeju.html">🍊 제주 보기</a>
  </div>
</main>
</body>
</html>
